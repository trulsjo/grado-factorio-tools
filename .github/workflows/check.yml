# What .githooks/pre-push runs, for a clone that never opted into the hooks, plus the one thing a
# hook cannot see: the pull request's title. `edited` is listed so a retitle is checked again.
#
# Windows, because the scripts are: the harness junctions mods in, and fetch-mods.ps1 reads
# %APPDATA%. No runner has Factorio, so load-harness.ps1 -SelfTest is not run here or anywhere
# but by hand; scripts/check.ps1's header says so.
name: check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script and run the self-tests
        run: pwsh -NoProfile -File scripts/check.ps1

      # Through the environment, never pasted into the command: a title is text somebody typed.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: pwsh
        run: ./scripts/commit-check.ps1 -ScopeFile commit-scopes.txt -Title $env:PR_TITLE
