# What .githooks/pre-push runs, for a clone that never opted into the hooks, plus what a hook
# does not run: the commits the tracked files cite, which reach origin/main only once pushed;
# a citation of our own code by line number, read over the whole tree; the pull request's title;
# and its body, for the commits it cites, for a closing keyword
# outside a `Closes #N` line, and for the pr template's three headings. `edited` is listed so a
# retitle or an edited body is checked again.
#
# On windows-latest and on ubuntu-latest, a job each (grado-factorio-tools#117): the scripts
# were written on Windows, grado-factorio-modpack's check runs on ubuntu-latest (its
# .github/workflows/check.yml at 43c30f3, read 2026-10-12), and a self-test can pass on one and
# fail on the other. Every self-test scripts/check.ps1 runs, it runs on both. No runner has
# Factorio, so load-harness.ps1 -SelfTest is not run here or anywhere but by hand;
# scripts/check.ps1's header says so.
#
# workflow_dispatch starts both jobs by hand on a branch, with no pull request and so without
# the title and body steps:
#
#     gh workflow run check.yml --ref <branch>
name: check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, for the body check below: it asks whether a commit is on main, and a
      # shallow clone cannot say. pr-body-check.ps1 refuses to run in one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse every script and run the self-tests
        run: pwsh -NoProfile -File scripts/check.ps1

      # A whole-tree check, run here and not by pre-push (grado-factorio-tools#346, #319 ruling
      # 8): a commit is on origin/main only once pushed. The two pages are records, which may
      # cite a branch's commits on purpose.
      - name: Check that each commit the tree cites is on main
        run: pwsh -NoProfile -File scripts/cited-commit-check.ps1 -Exempt 'docs/measurements.md,docs/agents/code-review-evidence.md'

      # A whole-tree check too (grado-factorio-tools#347, #319 ruling 8). Before it was switched
      # on, `pwsh -File scripts/line-cite-check.ps1` read 83 files on 2026-11-07 and found 9
      # path-and-line citations and 1 continuation, and failed on 1: a false positive, a quoted
      # specimen in docs/research/scripts-checks.md, reworded. Nothing here is foreign code.
      # The floors fail a run whose patterns stopped matching (#379): on 2026-11-08, on branch
      # 373-394-strict-list-and-review-slips, the same command read 86 files and found 67
      # path-and-line citations and 6 continuations, none of our own code.
      - name: Check that no prose cites our own code by line number
        run: pwsh -NoProfile -File scripts/line-cite-check.ps1 -MinCitations 50 -MinContinuations 4

      # Through the environment, never pasted into the command: a title is text somebody typed.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: pwsh
        run: ./scripts/commit-check.ps1 -ScopeFile commit-scopes.txt -Title $env:PR_TITLE

      # `edited` runs this again too.
      - name: Check the pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: pwsh
        run: ./scripts/pr-body-check.ps1 -Body "$env:PR_BODY" -CiteSiblings -RequireSummaryVisual
